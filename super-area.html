<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Super Area Component Demo</title>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.14.0/cdn/themes/light.css" />
	<script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.14.0/cdn/shoelace-autoloader.js"></script>
	<style>
		body {
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
			margin: 2rem auto;
			padding: 0 1rem;
			min-height: 100vh;
			background: white;
		}

		.demo-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			margin: 2rem 0;
			gap: 2rem;
		}

		code {
			background: #f5f5f5;
			padding: 0.5rem 1rem;
			border-radius: 4px;
			margin: 1rem 0;
			font-family: 'JetBrains Mono', monospace;
		}

		.preview-area {
			width: 70vw;
			min-height: 70vh;
			padding: 4rem;
			border: 1px solid rgba(0, 0, 0, 0.1);
			border-radius: 8px;
			background: white;
			font-family: 'JetBrains Mono', monospace;
			white-space: pre-wrap;
			display: none;
			box-sizing: border-box;
		}

		.preview-area.visible {
			display: block;
		}

		.controls {
			display: flex;
			gap: 1rem;
			margin-top: 1rem;
		}
	</style>
</head>
<body>
	<div class="demo-container">
		<super-area width="70vw" height="70vh" font="JetBrains Mono"></super-area>
		<div class="controls">
			<sl-button variant="primary" id="previewBtn">
				<sl-icon slot="prefix" name="eye"></sl-icon>
				Preview
			</sl-button>
			<sl-button variant="default" id="editBtn" style="display: none;">
				<sl-icon slot="prefix" name="pencil"></sl-icon>
				Edit
			</sl-button>
		</div>
		<div id="previewArea" class="preview-area"></div>
	</div>

	<script type="module">
		import { SuperArea } from './components/super-area.js';

		const superArea = document.querySelector('super-area');
		const previewBtn = document.querySelector('#previewBtn');
		const editBtn = document.querySelector('#editBtn');
		const previewArea = document.querySelector('#previewArea');

		previewBtn.addEventListener('click', () => {
			const textarea = superArea.shadowRoot.querySelector('textarea');
			const computedStyle = getComputedStyle(textarea);

			// Copy all relevant dimensions
			previewArea.style.width = computedStyle.width;
			previewArea.style.height = computedStyle.height;
			previewArea.style.padding = computedStyle.padding;
			previewArea.style.fontSize = computedStyle.fontSize;
			previewArea.style.lineHeight = computedStyle.lineHeight;
			previewArea.textContent = textarea.value;

			superArea.style.display = 'none';
			previewBtn.style.display = 'none';
			editBtn.style.display = 'inline-flex';
			previewArea.classList.add('visible');
		});

		editBtn.addEventListener('click', () => {
			superArea.style.display = 'block';
			previewBtn.style.display = 'inline-flex';
			editBtn.style.display = 'none';
			previewArea.classList.remove('visible');
		});
	</script>
</body>
</html>
